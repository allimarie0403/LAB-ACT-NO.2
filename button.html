<!DOCTYPE html>
<html>
<body>      
    <button class="subscribe-button">SUBSCRIBE</button>
    <style>
        .subscribe-button{
            background-color: red;
            color:white;
            border: none;
            height: 40px;
            width: 110px;
            border-radius: 5%;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 15px;
            transition: opacity 0.80s;
        }
 
        .subscribe-button:hover {
            background-color: green;
            opacity: 0.5;
        }
 
        .subscribe-button:active {
            background-color: blue;
        }
    </style>
 
        <button class="join-button">JOIN</button>
    <style>
        .join-button{
            background-color: white;
            border-color: rgb(41,188,211);
            border-style: solid;
            border-width: 1px;
            color:rgb(41,188,211);
            border-radius: 2%;
            height: 40px;
            width: 110px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            margin-right: 15px;
            padding-left: 10px;
        }
 
        .join-button:hover {
            background-color: rgb(41,188,211);
            color:white;
        }
    </style>
 
        <button class="tweet-button">Tweet</button>
    <style>
        .tweet-button{
            background-color:rgb(2,158,255);
            border-color: rgb(41,188,211);
            border-style: solid;
            border-width: 1px;
            color:white;
            height: 40px;
            width: 110px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</body>
</html>
